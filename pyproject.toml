[project]
name = "signal-service"
version = "0.1.0"
description = "Phase-1 market observer: MT5 bars -> Brooks features -> LLM read -> Telegram alerts. No trading."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "exchange_calendars>=4.5",
    "matplotlib>=3.9",
    "mplfinance>=0.12.10b0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
