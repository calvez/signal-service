# Copy to config.yaml. Secrets go in .env, never here.

server_time_mode: "ny_plus_7"     # confirm in task T2: ny_plus_7 | iana:<Zone> | fixed:<seconds>

symbols:
  GER40.cash: { name: DAX,    session: eu, role: traded,  calendar: XETR }
  UK100.cash: { name: FTSE,   session: eu, role: context, calendar: XLON }
  US100.cash: { name: Nasdaq, session: us, role: traded,  calendar: XNYS }
  US30.cash:  { name: Dow,    session: us, role: traded,  calendar: XNYS }

sessions:
  # cash_close: when the cash market closes; the prior-close price for "gap" is taken there.
  eu: { tz: Europe/Berlin,    start: "09:00", end: "11:00", brief_at: "08:45", cash_close: "17:30" }
  us: { tz: America/New_York, start: "09:30", end: "11:30", brief_at: "09:15", cash_close: "16:00" }

rules:
  max_trades_per_day: 3
  cooldown_after_win_min: 30
  htf_neutral_counts_as_conflict: true
  min_reward_risk: 1.0
  stop_atr_min: 0.3
  stop_atr_max: 3.0
  entry_max_atr_from_close: 1.0
  push_grades: [A]               # B reads are logged; set [A, B] to push both

features:
  ema_period: 20
  atr_period: 14
  swing_confirm_bars: 2
  opening_range_bars: 6
  prompt_bars: 36

llm:
  # Benchmark 2-3 models on the same logged days before settling.
  model: "moonshotai/kimi-k3"   # OpenRouter model id (benchmark others on logged days)
  provider_order: []            # pin providers so behaviour doesn't drift
  allow_fallbacks: false
  temperature: 0
  timeout_sec: 30
  daily_budget_usd: 3.00
  prompt_version: "v2"

# High-impact events, entered by hand for now. Times in the event's own zone.
news:
  - { at: "2026-10-06T08:30", tz: America/New_York, name: "example — replace" }
news_window_min: 2

telegram:
  display_tz: Europe/Budapest
  quiet_hours: { start: "22:00", end: "07:00" }   # ops alerts silent unless positions are open
  chart: { bars: 60, width: 1080, height: 1350 }

reports:
  daily_at: "18:00"               # Europe/Berlin
  tz: Europe/Berlin

ftmo:                               # confirm against your account's objectives
  initial_balance: 160000
  daily_loss_pct: 5
  max_loss_pct: 10
  day_reset_tz: Europe/Prague       # daily limit resets at midnight CE(S)T
  warn_levels_pct: [50, 80]

monitors:
  heartbeat_timeout_session_sec: 180
  heartbeat_timeout_other_sec: 600
  disk_min_free_pct: 10

engine:
  # Python strategy for the market evaluation (app/strategies). Empty = none yet: the LLM reads
  # the chart itself (llm.prompt_version). Set it, e.g. "h2_pullback", and Python proposes the
  # setups while the LLM recommends take / watch / skip with engine.prompt_version.
  strategy: ""
  prompt_version: "v3"

management:
  # How a position is played after the entry (app/position.py). Lorant: no fixed target,
  # pyramiding into runners, stop follows the growing exposure. Placeholder numbers: to be set.
  mode: "pyramid"          # pyramid | fixed_target (target from the setup, old behaviour)
  risk_pct: 0.5            # first unit risks 0.5% of the initial balance = 1R (EUR 800 on 160k)
  max_adds: 2              # at most 2 more units
  add_every_r: 1.0         # add one unit each time price runs another +1R from the first entry
  add_size: 1.0            # each add = 1x the first unit
  max_open_risk_r: 0.0     # after an add the stop moves so the whole position cannot lose (0R)
  trail: "swing"           # also trail behind the last confirmed M5 swing (or "none")
